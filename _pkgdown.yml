reference:
  - title: Render
    desc: >
      Render a LimeSurvey survey to a Word or PDF document. The
      output format is inferred from the extension of `output`
      (`.docx` or `.pdf`). Each function accepts either a path to
      a `.lss` file or a pre-parsed `lss` object returned by
      `read_lss()`.
    contents:
      - render_questionnaire
      - render_audit
  - title: Read and audit
    desc: >
      Parse a `.lss` file into a structured object, and audit a
      survey for reviewable anomalies (missing translations,
      dangling references, structural issues). Useful for
      inspecting a survey before rendering, or for rendering
      several variants from a single parse.
    contents:
      - read_lss
      - audit_lss
  - title: Author (experimental)
    desc: >
      Build a survey specification programmatically and write it
      as an importable LimeSurvey 6 `.lss` file. The specification
      is validated in depth at construction time, because
      LimeSurvey imports silently and only surfaces mistakes once
      respondents hit them. The written file round-trips through
      `read_lss()` and `audit_lss()`. The same specification can
      also be rendered as a Word authoring form -- one key/value
      table per block, meant to be filled in and handed back --
      either from an existing spec or as a blank template, and read
      back from the filled-in form into a specification, with a
      dry-run check that lists every problem of a document at once.
      An existing survey read by `read_lss()` can be converted back
      into a specification, so a questionnaire already in LimeSurvey
      can be edited through the same form.
    contents:
      - lss_spec
      - write_lss
      - as_lss_spec
      - write_form_docx
      - lss_template_docx
      - read_form_docx
      - check_form_docx
  - title: Package overview
    contents:
      - lssdoc-package
